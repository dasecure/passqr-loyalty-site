<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — PassQR Loyalty</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1310;--muted:#6E605A;--paper:#FBF7F2;--espresso:#3B2416;--amber:#D2802B;--line:#E7DED2;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 20px;
  background:var(--paper);color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6}
.box{max-width:520px;text-align:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.12;letter-spacing:-.015em;margin:0 0 16px}
p{margin:0;color:#3C302A}
.stamps{display:flex;gap:9px;justify-content:center;margin-bottom:28px}
.s{width:26px;height:26px;border-radius:50%;border:1.5px dashed #C9B9A6}
.s.on{background:var(--amber);border:1.5px solid var(--amber)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
a.btn{display:inline-flex;align-items:center;padding:13px 24px;border-radius:999px;
  font-weight:600;text-decoration:none;border:1.5px solid transparent;font-size:1rem}
.p{background:var(--espresso);color:#FFF6EA}
.g{border-color:var(--line);background:#fff;color:var(--ink)}
small{display:block;margin-top:26px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
  <div class="box">
    <div class="stamps">
      <span class="s on"></span><span class="s on"></span><span class="s on"></span>
      <span class="s"></span><span class="s"></span>
    </div>
    <h1>This one's not on the card.</h1>
    <p>The page you're after doesn't exist — or it moved. The stamps are still safe.</p>
    <div class="row">
      <a class="btn p" href="/">Back to the start</a>
      <a class="btn g" id="demo" href="https://demo.passqr.com">See the demo</a>
    </div>
    <small>PassQR Loyalty — a DaSecure product</small>
  </div>
<script>
  /* Keep in step with index.html */
  var DEMO_URL = "https://demo.passqr.com";
  document.getElementById("demo").href = DEMO_URL;
</script>
</body>
</html>
